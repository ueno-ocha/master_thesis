#Attentionの誘導手法
attention_guiding:
  method: gender_attention_averaging

  allowed_methods:
    - profession_to_gender
    - tokens_to_gender
    - gender_attention_averaging
  
  guiding_direction: stereotype

#誘導する層の設定
attention_layer_selection:
  mode: fixed       # random / fixed
  num_layers: 3     # random のときに使用
  seed: 42          # random の再現性用

  # mode: fixed のときに使用
  fixed_layers: [8, 9, 10]

#誘導するヘッドの設定
attention_head_selection:
  mode: fixed     # random / fixed
  num_heads: 6     # random のときに使用
  seed: 42         # random の再現性用

  # mode: fixed のときに使用
  fixed_heads: [1,3,5,7,9,11]

#学習に用いるサンプル数
num_sample: 20

